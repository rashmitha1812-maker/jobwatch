<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Watch</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--fg:#1a1d21;--mut:#5f6b7a;--line:#dfe3e8;--acc:#0a66c2;--new:#1a7f37;--chip:#eaf0f6}
@media(prefers-color-scheme:dark){:root{--bg:#101316;--card:#1a1e23;--fg:#e8eaed;--mut:#9aa5b1;--line:#2b323a;--acc:#6aa8ff;--new:#3fb950;--chip:#262d36}}
*{box-sizing:border-box}body{font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--fg);margin:0}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}.sub{color:var(--mut);font-size:13px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:120px}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mut)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 14px}
input,select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
input[type=search]{flex:1;min-width:170px}
label.t{display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
.job{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.job.new{border-left:4px solid var(--new)}.job.gone{opacity:.55}
a.ttl{font-weight:600;font-size:16px;color:var(--acc);text-decoration:none}a.ttl:hover{text-decoration:underline}
.meta{color:var(--mut);font-size:13px;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px}.chip.role{outline:1px solid var(--acc)}
.badge{background:var(--new);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;margin-right:6px;vertical-align:middle}
details summary{cursor:pointer;color:var(--acc);font-size:13px;margin-top:8px}
.desc{white-space:pre-wrap;font-size:13px;margin-top:6px;padding:10px;background:var(--bg);border-radius:8px;max-height:300px;overflow:auto}
.bad{color:#d33}.m{color:var(--mut);font-size:13px}
.sec{font-size:12px;font-weight:700;margin:20px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}.star{color:#e3a008;margin-right:4px}
</style></head><body><div class="wrap">
<h1>Job Watch</h1><div class="sub" id="upd">Loading…</div>
<div class="stats" id="stats"></div>
<div class="bar"><input type="search" id="q" placeholder="Search title or company">
<select id="c"><option value="">All companies</option></select>
<select id="a"><option value="0">Found: any time</option><option value="1">Last 24 hours</option><option value="7">Last 7 days</option></select>
<label class="t"><input type="checkbox" id="p"> ★ Priority only</label>
<label class="t"><input type="checkbox" id="m" checked> CV match only</label>
<label class="t"><input type="checkbox" id="g"> Show closed</label></div>
<div id="list"></div>
<details><summary>Company status</summary><div id="st"></div></details>
</div><script>
const $=id=>document.getElementById(id);let db;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago=t=>{if(!t)return"";const m=(Date.now()-new Date(t))/6e4;return m<2?"just now":m<60?Math.round(m)+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"};
const BAD=/^(skip to|jump to|jetzt bewerben|top of page|go to|zum inhalt|nach oben|to the glossary|more information)/i;
function prep(){const st=db.status||{};
 return Object.entries(db.jobs||{}).filter(([u,j])=>!u.includes("#")&&!u.startsWith("javascript")&&!BAD.test(j.title||""))
 .map(([u,j])=>{const s=st[j.company];return {u,...j,gone:!!(s&&s.ok&&s.checked>j.last_seen),isNew:j.first_seen>db.baseline,
  k:(j.matches||[]).length+(j.roles||[]).length}});}
async function load(){
 try{db=await (await fetch("data/jobs.json?t="+Date.now())).json()}catch(e){$("upd").textContent="Could not load data";return}
 const st=Object.entries(db.status||{});
 const last=st.map(([,s])=>s.checked).sort().pop();
 const r=db.run;
 $("upd").textContent=last?("Last check "+ago(last)+(r?" · run took "+r.seconds+"s":"")):"No data yet";
 const sel=$("c"),cur=sel.value;sel.innerHTML='<option value="">All companies</option>'+st.map(([n])=>`<option>${esc(n)}</option>`).join("");sel.value=cur;
 $("st").innerHTML=st.sort((a,b)=>a[1].ok-b[1].ok).map(([n,s])=>`<div class="m">${s.ok?"✓":'<span class="bad">✗</span>'} ${s.priority?"★ ":""}${esc(n)} — ${s.count} links${s.ok?"":" — "+esc(s.error||"")}</div>`).join("");
 render();}
function render(){
 const q=$("q").value.toLowerCase(),c=$("c").value,m=$("m").checked,g=$("g").checked,po=$("p").checked,days=+$("a").value;
 const all=prep(),cut=days?Date.now()-days*864e5:0,day=Date.now()-864e5;
 const rows=all.filter(j=>(!c||j.company===c)&&(g||!j.gone)&&(!po||j.priority)&&(!m||j.k>0||j.priority)&&(!cut||new Date(j.first_seen)>cut)&&(!q||((j.title||"")+j.company+(j.loc||"")).toLowerCase().includes(q)))
  .sort((a,b)=>b.first_seen.localeCompare(a.first_seen)||b.k-a.k);
 const fails=Object.values(db.status||{}).filter(s=>!s.ok).length;
 const fresh=j=>j.isNew&&new Date(j.first_seen)>day;
 $("stats").innerHTML=`<div class="stat"><b>${all.filter(j=>fresh(j)&&!j.gone).length}</b><span>new in 24 h</span></div>
 <div class="stat"><b>${all.filter(j=>!j.gone&&j.priority).length}</b><span>★ priority postings</span></div>
 <div class="stat"><b>${all.filter(j=>!j.gone&&j.k>0).length}</b><span>CV / role matches</span></div>
 <div class="stat"><b class="${fails?"bad":""}">${fails}</b><span>companies failing</span></div>`;
 const pend=all.filter(j=>!j.matches&&!j.unreadable).length;
 const card=j=>{const when=j.posted?("posted "+j.posted):("found "+ago(j.first_seen));
  return `<div class="job${j.isNew?" new":""}${j.gone?" gone":""}">${fresh(j)?'<span class="badge">NEW</span>':""}<a class="ttl" href="${esc(j.u)}" target="_blank" rel="noopener">${j.priority?'<span class="star">★</span>':""}${esc(j.title)}</a>
  <div class="meta">${esc(j.company)}${j.loc?" · "+esc(j.loc):""} · ${when}${j.deadline?" · apply by "+esc(j.deadline):""}${j.gone?" · no longer listed":""}</div>
  <div class="chips">${(j.roles||[]).map(x=>`<span class="chip role">${esc(x)}</span>`).join("")}${(j.matches||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>
  ${j.desc?`<details><summary>Show job text</summary><div class="desc">${esc(j.desc)}</div></details>`:""}</div>`};
 const pri=rows.filter(j=>j.priority),rest=rows.filter(j=>!j.priority);
 let out=pend?`<p class="m">${pend} postings are still being read (60 per run).</p>`:"";
 if(pri.length)out+=`<div class="sec"><span class="star">★</span>Priority companies · ${pri.length}</div>`+pri.map(card).join("");
 if(rest.length)out+=(pri.length?`<div class="sec">Other companies · ${rest.length}</div>`:"")+rest.map(card).join("");
 $("list").innerHTML=out||'<p class="m">Nothing matches these filters.</p>';}
["q","c","a","m","g","p"].forEach(i=>$(i).addEventListener("input",()=>db&&render()));
load();setInterval(load,3*6e4);
</script></body></html>
