name: check-jobs
on:
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch:
concurrency: check-jobs
permissions: {contents: write}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python checker.py
      - run: |
          git config user.name jobwatch && git config user.email jobwatch@users.noreply.github.com
          git add data/jobs.json
          git diff --staged --quiet || {
            git commit -m "update jobs"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 5
            done
          }
